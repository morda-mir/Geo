name: build-happ-compatible-geo

# Build production Happ geo assets from source routing rules.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/geosite/**'
      - 'src/geoip/**'
      - 'build_morda_geo_happ.py'
      - '.github/workflows/build-happ-compatible-geo.yml'

permissions:
  contents: write

concurrency:
  group: geo-dist-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Happ-compatible geosite.dat and geoip.dat
        run: python3 build_morda_geo_happ.py

      - name: Commit generated geo assets
        run: |
          if git diff --quiet -- dist; then
            echo 'No dist changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            dist/geosite.dat \
            dist/geosite.dat.sha256 \
            dist/geoip.dat \
            dist/geoip.dat.sha256 \
            dist/incy-routing.json \
            dist/incy-routing-v2.json
          git commit -m 'build: refresh Happ-compatible dat files [skip ci]'
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo 'Push failed after 3 attempts'
          exit 1
